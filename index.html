<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UA 牌組分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>UNION ARENA <span>牌組分析</span></b><small>Rugia Deck Analyzer</small></header>
<main>
<section class="intro">
<small>DECK ANALYZER</small>
<h1>Rugia 牌組分析</h1>
<p>貼上 Rugia Creation 的 deckEdit 連結，立即建立牌組清單。</p>
</section>
<section class="import">
<label>Rugia Creation 牌組連結</label>
<textarea id="url" placeholder="貼上 Rugia deckEdit 連結"></textarea>
<div class="row"><input id="name" placeholder="牌組名稱（可留空）"><button id="go">匯入牌組</button></div>
<p id="msg"></p>
</section>
<section id="deck" class="hidden">
<div class="deckhead"><div><small>DECK</small><h2 id="title"></h2><p id="meta"></p></div><button id="clear" class="light">清除</button></div>
<div class="grid"><div id="cards" class="cards"></div><aside id="detail"><div class="empty">點擊左側卡片查看資料。</div></aside></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
