<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UA Playset Builder</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6f8,#101216);--panel:light-dark(#fff,#171a20);--panel2:light-dark(#f7f8fa,#1d2129);--text:light-dark(#171a1f,#f4f6f8);--muted:light-dark(#68707d,#9da5b3);--line:light-dark(#e2e6eb,#303641);--accent:light-dark(#5b4bdb,#9b8cff);--danger:#e76f51;--good:#35a46f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;background:var(--bg)}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:20px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:5}.brand{font-weight:850;letter-spacing:-.03em;font-size:20px}.brand span{color:var(--accent)}.tabs{display:flex;gap:4px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:9px;font-weight:650;cursor:pointer}.tab.active,.tab:hover{background:var(--panel2);color:var(--text)}.search{margin-left:auto;max-width:360px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:16px;max-width:1500px;margin:0 auto;padding:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{padding:16px;height:calc(100vh - 100px);position:sticky;top:82px;overflow:auto}.side-title{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.08em;margin:4px 0 10px}.side-item{display:flex;justify-content:space-between;padding:9px 10px;border-radius:8px;cursor:pointer}.side-item:hover,.side-item.active{background:var(--panel2)}.count{color:var(--muted);font-size:12px}
.main{min-width:0}.toolbar{padding:14px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.select,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 11px;border-radius:9px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{padding:10px;cursor:pointer;transition:.15s transform,.15s border-color;border:1px solid var(--line);background:var(--panel);border-radius:12px}.card:hover{transform:translateY(-2px);border-color:var(--accent)}.art{aspect-ratio:63/88;border-radius:8px;background:linear-gradient(145deg,#332b55,#161822 55%,#5e2c4b);display:flex;align-items:flex-end;padding:10px;color:white;overflow:hidden;position:relative}.art:after{content:'UNION ARENA';position:absolute;top:10px;right:10px;font-size:8px;letter-spacing:.14em;opacity:.7}.art .character{font-size:24px;font-weight:900;line-height:1}.meta{display:flex;justify-content:space-between;gap:6px;margin-top:9px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:3px}.tag{font-size:10px;border:1px solid var(--line);padding:3px 6px;border-radius:999px;color:var(--muted)}.qty{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.qty button{width:26px;height:26px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;cursor:pointer}.qty strong{font-size:13px}
.detail{padding:16px;height:calc(100vh - 100px);position:sticky;top:82px;overflow:auto}.detail-top{display:flex;gap:14px}.detail .art{width:115px;flex:none}.detail h2{margin:0 0 4px;font-size:20px}.muted{color:var(--muted)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 14px}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.ability{line-height:1.55;font-size:13px;white-space:pre-line}.credit{font-size:10px;color:var(--muted);line-height:1.4}.deckbox{background:var(--panel2);border-radius:10px;padding:11px;margin-top:10px}.deckrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.deckrow:last-child{border-bottom:0}.deckrow .mini{width:32px;height:45px;border-radius:4px;background:#40365f;flex:none}.deckrow .grow{min-width:0;flex:1}.deckrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.need{font-size:11px;color:var(--danger)}.owned{font-size:11px;color:var(--good)}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.status{font-size:12px;padding:6px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(0,1fr)}.detail{grid-column:1/-1;position:relative;top:auto;height:auto}.detail .art{width:95px}}@media(max-width:760px){header{padding:0 12px}.tabs{display:none}.search{max-width:210px}.layout{grid-template-columns:1fr;padding:10px}.sidebar{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{height:auto}}
</style></head>
<body><div class="app">
<header><div class="brand">UA <span>卡組</span></div><div class="tabs"><button class="tab active">卡片</button><button class="tab">我的卡庫</button><button class="tab">牌組</button></div><input id="search" class="search" placeholder="搜尋卡片名稱、卡號、效果文字…"/></header>
<div class="layout">
<aside class="panel sidebar"><div class="side-title">我的卡庫</div><div class="side-item active">全部卡片 <span class="count" id="ownedCount">0</span></div><div class="side-item">尚缺卡片 <span class="count" id="needCount">0</span></div><div class="side-title" style="margin-top:22px">作品</div><div class="side-item">鏈鋸人 <span class="count">UA53BT</span></div><div class="side-item">BLEACH <span class="count">EX15BT</span></div><div class="side-item">SAKAMOTO DAYS <span class="count">各彈</span></div><div class="side-title" style="margin-top:22px">顏色</div><div class="side-item">紫色 <span class="count">●</span></div><div class="side-item">藍色 <span class="count">●</span></div><div class="side-item">黃色 <span class="count">●</span></div></aside>
<main class="main"><div class="panel toolbar"><select id="set" class="select"><option value="all">全部卡包</option><option>UA53BT</option></select><select id="rarity" class="select"><option value="all">全部稀有度</option><option>SR</option><option>R</option><option>U</option><option>C</option></select><select id="color" class="select"><option value="all">全部顏色</option><option>Purple</option></select><button id="reset" class="btn">重設</button><span class="status" id="resultStatus"></span></div><div id="grid" class="grid"></div></main>
<aside class="panel detail" id="detail"></aside>
</div></div>
<script>
const cards=[
{id:'UA53BT/CSM-1-047',set:'UA53BT',rarity:'R',color:'Purple',name:'Chainsaw Man',jp:'チェンソーマン',trait:'Chainsaw Man',owned:2,max:4,bp:4000,energy:4,text:'This card is also treated as 〈Denji〉.\n\nWhen this card leaves the field: Choose 1.\n• Draw 2 cards.\n• If this character has face-down cards underneath it, play this card in your front line in active position.\n\nTrigger: Add this card to your hand, or Raid it if you meet its Energy requirement.'},
{id:'UA53BT/CSM-1-048',set:'UA53BT',rarity:'SR',color:'Purple',name:'Chainsaw Man',jp:'チェンソーマン',trait:'Chainsaw Man',owned:4,max:4,bp:4000,energy:4,text:'This card is also treated as 〈Denji〉.\n\nWhen this character finishes an attack, if it has a face-down card underneath it: Activate this character and give it the listed effect for this turn. Then place 1 face-down card underneath it into the Out-of-Play Area. If the card placed there is 〈Pochita〉, you may play up to 1 of that card in your Energy Line in Rested position.\n\nTrigger: Add this card to your hand, or Raid it if you meet its Energy requirement.'},
{id:'UA53BT/CSM-1-013',set:'UA53BT',rarity:'U',color:'Purple',name:'Power',jp:'パワー',trait:'Chainsaw Man',owned:1,max:4,bp:2500,energy:2,text:'When attacking: If you have 〈Denji〉 on your field, this character gets BP +500 for this turn.\n\nTrigger: Draw 1 card.'},
{id:'UA53BT/CSM-1-024',set:'UA53BT',rarity:'SR',color:'Purple',name:'Makima',jp:'マキマ',trait:'Public Safety',owned:3,max:4,bp:3500,energy:4,text:'While in the Front Line: Purple character cards you control other than 〈Makima〉 are also treated as Event cards everywhere.\n\nWhen played: The next Event card you use from your hand this turn with no listed special cost has its AP cost reduced by 1. Choose 1.\n• Draw 1 card.\n• Choose up to 1 other character you control; it gets BP +2000 this turn.\n\nTrigger: Add this card to your hand, or Raid it if you meet its Energy requirement.'},
{id:'UA53BT/CSM-1-010',set:'UA53BT',rarity:'R',color:'Purple',name:'Angel Devil',jp:'天使の悪魔',trait:'Public Safety',owned:0,max:4,bp:4000,energy:4,text:'During your turn, if you have 〈Makima〉 on your field, this character gains effects based on the number of Event cards you have used this turn.\n• 1 or more: BP +1000.\n• 2 or more: Cannot be blocked by characters with BP 4000 or more.\n\nTrigger: Draw 1 card.'},
{id:'UA53BT/CSM-1-068',set:'UA53BT',rarity:'C',color:'Purple',name:'Makima',jp:'マキマ',trait:'Public Safety',owned:4,max:4,bp:1500,energy:1,text:'When this card leaves the field: You may place up to 2 Character cards or 1 Event card from your hand into the Out-of-Play Area. If you do, return this card to your hand.\n\nDraw 1 card.'},
{id:'UA53BT/CSM-1-071',set:'UA53BT',rarity:'C',color:'Purple',name:'Future Devil',jp:'未来の悪魔',trait:'Public Safety',owned:2,max:4,bp:1000,energy:1,text:'Main Activate: Rest this card. Look at the top card of your deck, then put it on the top or bottom of your deck.\n\nTrigger: Draw 1 card.'},
{id:'UA53BT/CSM-1-079',set:'UA53BT',rarity:'U',color:'Purple',name:'We Made a Promise, Right?',jp:'約束したじゃないですか',trait:'Event',owned:0,max:4,bp:null,energy:2,text:'Activate up to 2 of your AP cards.\n\nIf you have no Life, place the top card of your deck into your Life Area.'}
];
let selected=cards[0];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function art(c,small=false){return `<div class="art" ${small?'style="aspect-ratio:63/88"':''}><div class="character">${esc(c.name)}</div></div>`}
function render(){const q=document.getElementById('search').value.toLowerCase(),set=document.getElementById('set').value,rarity=document.getElementById('rarity').value,color=document.getElementById('color').value;const list=cards.filter(c=>(set==='all'||c.set===set)&&(rarity==='all'||c.rarity===rarity)&&(color==='all'||c.color===color)&&(`${c.name} ${c.jp} ${c.id} ${c.text} ${c.trait}`.toLowerCase().includes(q)));document.getElementById('resultStatus').textContent=`${list.length} cards`;document.getElementById('grid').innerHTML=list.map(c=>`<div class="card" data-id="${c.id}">${art(c)}<div class="meta"><div><div class="name">${esc(c.name)}</div><div class="sub">${c.id} · ${c.trait}</div></div><span class="tag">${c.rarity}</span></div><div class="qty"><span class="sub">Owned ${c.owned}/${c.max}</span><div><button onclick="event.stopPropagation();change('${c.id}',-1)">−</button> <strong>${c.owned}</strong> <button onclick="event.stopPropagation();change('${c.id}',1)">+</button></div></div></div>`).join('')||'<div class="empty">No cards match your filters.</div>';document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{selected=cards.find(c=>c.id===el.dataset.id);detail()});const owned=cards.reduce((n,c)=>n+c.owned,0),need=cards.reduce((n,c)=>n+Math.max(0,c.max-c.owned),0);document.getElementById('ownedCount').textContent=owned;document.getElementById('needCount').textContent=need}
function detail(){const c=selected;document.getElementById('detail').innerHTML=`<div class="detail-top">${art(c)}<div><h2>${esc(c.name)}</h2><div class="muted">${c.id}</div><div class="chips"><span class="tag">${c.set}</span><span class="tag">${c.rarity}</span><span class="tag">${c.color}</span>${c.bp?`<span class="tag">${c.energy} Energy · ${c.bp} BP</span>`:''}</div><button class="btn primary" onclick="change('${c.id}',1)">Add to playset</button></div></div><div class="section"><div class="side-title">Translated ability</div><div class="ability">${esc(c.text)}</div></div><div class="section"><div class="side-title">Playset</div><div class="deckbox"><div class="deckrow"><div class="mini"></div><div class="grow"><b>${esc(c.name)}</b><span class="owned">Owned ${c.owned}/${c.max}</span></div><button class="btn" onclick="change('${c.id}',-1)">−</button><b>${c.owned}</b><button class="btn" onclick="change('${c.id}',1)">+</button></div></div></div><div class="section"><div class="side-title">Deck builder preview</div><div class="muted" style="font-size:12px">Cards added to a deck can remain visible here while you read the translated effect. Deck quantity is tracked separately from your total playset.</div></div><div class="section credit">Prototype card text is based on the publicly indexed Union Arena Chinese card database at Rugia Creation. Card images are represented by placeholders in this preview; production use should respect Bandai image rights and Rugia's stated attribution requirements.</div>`}
function change(id,d){const c=cards.find(x=>x.id===id);c.owned=Math.max(0,Math.min(c.max,c.owned+d));selected=c;render();detail()}
document.getElementById('search').oninput=render;document.getElementById('set').onchange=render;document.getElementById('rarity').onchange=render;document.getElementById('color').onchange=render;document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';document.getElementById('set').value='all';document.getElementById('rarity').value='all';document.getElementById('color').value='all';render()};render();detail();
</script></body></html>
