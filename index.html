<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UA 牌組分析</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>UNION ARENA <span>牌組分析</span></b><div class="userbar"><span id="userLabel">未登入</span><button id="loginBtn" class="light small">登入 / 註冊</button><button id="logoutBtn" class="light small hidden">登出</button></div></header>
<main><section class="intro"><small>DECK ANALYZER</small><h1>Rugia 牌組分析</h1><p>支援不同 Union Arena IP 的 Rugia deckEdit 牌組。查看能源、AP、BP、完整效果與卡類。</p><p id="dbStatus" class="dbstatus">正在載入卡片資料庫…</p></section>
<section class="import"><label>Rugia Creation 牌組連結</label><textarea id="url" placeholder="貼上 Rugia deckEdit 連結，例如不同 IP 的 Version / Deck"></textarea><div class="row"><input id="name" placeholder="牌組名稱（可留空）"><button id="go">匯入牌組</button></div><p id="msg"></p></section>
<section id="account" class="account hidden"><div><small>MY DECKS</small><h2>我的牌組</h2></div><div id="savedDecks" class="saved"></div></section>
<section id="deck" class="hidden"><div class="deckhead"><div><small>DECK</small><h2 id="title"></h2><p id="meta"></p></div><div class="deck-actions"><button id="saveDeck">儲存牌組</button><button id="shareDeck" class="light">分享牌組</button><button id="clear" class="light">清除</button></div></div><div class="grid"><div id="cards" class="cards"></div><aside id="detail"><div class="empty">點擊左側卡片查看資料。</div></aside></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="closeModal" class="close">×</button><h2>登入 / 註冊</h2><p class="muted">使用 Email 和密碼儲存你的牌組。</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密碼（至少6位）"><div class="row"><button id="signup">註冊</button><button id="signin" class="light">登入</button></div><p id="authMsg"></p></div></div>
<script type="module" src="app.js"></script></body></html>
