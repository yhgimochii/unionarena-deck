<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1016">
  <title>Union Arena Simulator</title>
  <link rel="stylesheet" href="simulator.css">
</head>
<body>
  <main class="simulator-home">
    <a class="back-link" href="../">← 返回牌組分析</a>
    <header class="simulator-header">
      <p class="eyebrow">UNION ARENA · PLAYTEST</p>
      <h1>對戰模擬器</h1>
      <p class="intro">建立私人房間，或使用開發者測試模式操作雙方牌組。</p>
    </header>
    <section class="mode-grid" aria-label="模擬器模式">
      <article class="mode-card">
        <div class="mode-icon" aria-hidden="true">⚔</div>
        <p class="mode-label">ONLINE PLAY</p>
        <h2>線上對戰</h2>
        <p>建立房間代碼，邀請另一位玩家加入。雙方從自己的牌組庫選擇牌組。</p>
        <span class="status">即將推出</span>
      </article>
      <a class="mode-card mode-card-link" href="developer.html">
        <div class="mode-icon" aria-hidden="true">⌘</div>
        <p class="mode-label">DEVELOPER</p>
        <h2>開發者測試模式</h2>
        <p>由你操作雙方牌組與手牌，用於測試洗牌、抽牌及場地操作。</p>
        <span class="status">開始測試 →</span>
      </a>
    </section>
    <p class="footnote">Developer Test Mode 已可載入牌組並測試洗牌、抽牌與手動移動卡片；線上房間功能將於後續加入。</p>
  </main>
</body>
</html>
