<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UA 牌組分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>UNION ARENA <span>牌組分析</span></b><small>Rugia Deck Analyzer</small></header>
<main>
<section class="intro"><small>DECK ANALYZER</small><h1>Rugia 牌組分析</h1><p>貼上 Rugia Creation 的 deckEdit 連結，立即建立牌組清單，點選卡片查看繁體中文效果。</p></section>
<section class="import">
<label for="url">Rugia Creation 牌組連結</label>
<textarea id="url" placeholder="貼上 Rugia deckEdit 連結（或只貼 Deck= 後面的內容）"></textarea>
<div class="row"><input id="name" placeholder="牌組名稱（可留空）"><button id="go">匯入牌組</button></div>
<p id="msg"></p>
<details><summary>批次貼上卡片資料（從 Rugia 卡片頁複製）</summary>
<textarea id="bulk" placeholder="每張卡以卡號開頭，例如：&#10;UA53BT/CSM-1-049 (U)&#10;卡名&#10;效果文字…"></textarea>
<button id="bulkgo" class="light">解析並儲存</button></details>
</section>
<section id="deck" class="hidden">
<div class="deckhead"><div><small>DECK</small><h2 id="title"></h2><p id="meta"></p></div><button id="clear" class="light">清除</button></div>
<div class="grid"><div id="cards" class="cards"></div><aside id="detail" class="detail"></aside></div>
</section>
</main>
<script src="cards-data.js"></script>
<script src="app.js"></script>
</body>
</html>
