<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UA 牌組分析</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>UNION ARENA <span>牌組分析</span></b><div class="userbar"><span id="userLabel">未登入</span><button id="loginBtn" class="light small">登入 / 註冊</button><button id="logoutBtn" class="light small hidden">登出</button></div></header>
<main>
<section class="hero">
  <img class="hero-logo" src="union-arena-logo.png" alt="UNION ARENA" />
  <h1>Rugia 牌組分析</h1>
  <button id="toggleImport" class="submit-link-btn" type="button" aria-expanded="false">Submit Link</button>
</section>
<section id="importPanel" class="import hidden" aria-hidden="true">
  <div class="import-head"><label>Rugia Creation 牌組連結</label><button id="collapseImport" class="light small" type="button">收起</button></div>
  <textarea id="url" placeholder="貼上 Rugia deckEdit 連結，例如不同 IP 的 Version / Deck"></textarea><div class="row deck-import-row">
<input id="name" placeholder="牌組名稱（可留空）">
<div class="deck-color-picker">
<select id="deckColor" aria-label="牌組顏色">
<option value="red">紅色</option><option value="blue">藍色</option><option value="yellow">黃色</option><option value="green">綠色</option><option value="purple">紫色</option>
</select><span id="deckColorPreview" class="color-dot red" aria-hidden="true"></span>
</div>
<button id="go">匯入牌組</button></div><p id="msg"></p></section>
<section id="account" class="account hidden"><div><small>MY DECKS</small><h2>我的牌組</h2></div><div id="savedDecks" class="saved"></div></section>
<section id="deck" class="hidden"><div class="deckhead"><div><small>DECK</small><h2 id="title"></h2><p id="meta"></p></div><div class="deck-actions"><button id="saveDeck" class="icon-action" type="button" title="儲存牌組" aria-label="儲存牌組"></button><button id="shareDeck" class="icon-action light" type="button" title="分享牌組" aria-label="分享牌組"></button><button id="clear" class="icon-action light" type="button" title="清除牌組" aria-label="清除牌組"></button></div></div><div class="grid"><div id="cards" class="cards"></div><button id="mobileDetailBtn" class="mobile-detail-btn" type="button">查看卡片資料</button>
  <aside id="detail" class="detail"><div class="empty">點擊左側卡片查看資料。</div></aside></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="closeModal" class="close">×</button><h2>登入 / 註冊</h2><p class="muted">使用 Email 和密碼儲存你的牌組。</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密碼（至少6位）"><div class="row"><button id="signup">註冊</button><button id="signin" class="light">登入</button></div><p id="authMsg"></p></div></div>
<script type="module" src="app.js"></script><div id="mobileDetailModal" class="mobile-detail-modal hidden" aria-hidden="true">
  <div class="mobile-detail-backdrop" data-close-mobile-detail></div>
  <div class="mobile-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="mobileDetailTitle">
    <div class="mobile-detail-head">
      <strong id="mobileDetailTitle">卡片資料</strong>
      <button type="button" class="mobile-detail-close" data-close-mobile-detail aria-label="關閉">×</button>
    </div>
    <div id="mobileDetailContent" class="mobile-detail-content"></div>
  </div>
</div>

<div id="editDeckModal" class="edit-deck-modal hidden" aria-hidden="true">
  <div class="edit-deck-box" role="dialog" aria-modal="true" aria-labelledby="editDeckTitle">
    <div class="edit-deck-head">
      <strong id="editDeckTitle">編輯牌組</strong>
      <button id="closeEditDeck" class="edit-deck-x" type="button" aria-label="關閉">×</button>
    </div>
    <label class="edit-deck-label" for="editDeckName">牌組名稱</label>
    <input id="editDeckName" class="edit-deck-input" type="text" maxlength="80" placeholder="牌組名稱">

    <label class="edit-deck-label" for="editDeckColor">牌組顏色</label>
    <div class="edit-deck-color-row">
      <span id="editDeckColorPreview" class="color-dot red"></span>
      <select id="editDeckColor" class="edit-deck-input">
        <option value="red">紅色</option>
        <option value="blue">藍色</option>
        <option value="yellow">黃色</option>
        <option value="green">綠色</option>
        <option value="purple">紫色</option>
      </select>
    </div>

    <div id="editDeckEditMsg" class="edit-deck-msg"></div>
    <div class="edit-deck-actions">
      <button id="cancelEditDeck" class="light" type="button">取消</button>
      <button id="confirmEditDeck" type="button">儲存變更</button>
    </div>
  </div>
</div>

</body></html>
