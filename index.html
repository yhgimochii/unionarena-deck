<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UA 牌組分析</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6f8,#101216);--panel:light-dark(#fff,#171a20);--panel2:light-dark(#f7f8fa,#1d2129);--text:light-dark(#171a1f,#f4f6f8);--muted:light-dark(#68707d,#9da5b3);--line:light-dark(#e2e6eb,#303641);--accent:light-dark(#5b4bdb,#9b8cff);--danger:#e76f51;--good:#35a46f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
header{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;background:var(--bg);z-index:5}.brand{font-weight:850;font-size:20px;letter-spacing:-.03em}.brand span{color:var(--accent)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 480px;gap:16px;max-width:1500px;margin:0 auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.side,.detail{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;align-self:start}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}h3:not(:first-child){margin-top:20px}
textarea,input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 10px;font:inherit;font-size:13px}textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.saved{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer}.saved:hover,.saved.on{background:var(--panel2)}.saved small{color:var(--muted)}.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.head h2{margin:0;font-size:20px}.stat{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel)}.item:hover,.item.on{border-color:var(--accent)}
.thumb{width:36px;height:50px;border-radius:5px;background:linear-gradient(145deg,#332b55,#161822);flex:none;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.grow{flex:1;min-width:0}.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted)}.qty{font-weight:800;font-size:18px;min-width:32px;text-align:center;color:var(--accent)}
.tag{font-size:10px;border:1px solid var(--line);padding:3px 6px;border-radius:999px;color:var(--muted)}.miss{color:var(--danger)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.ability{line-height:1.6;font-size:14px;white-space:pre-line}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.big{width:130px;aspect-ratio:63/88;border-radius:8px;background:linear-gradient(145deg,#332b55,#161822 55%,#5e2c4b);overflow:hidden;margin-bottom:10px}.big img{width:100%;height:100%;object-fit:cover;display:block}
a{color:var(--accent)}
.viewer{display:flex;gap:16px;align-items:flex-start}.viewer .big{width:170px;flex:none;margin:0}.viewer .r{min-width:0;flex:1}
.cid{font-size:13px;color:var(--muted);letter-spacing:.02em}.cname{font-size:22px;font-weight:800;margin:2px 0 10px;padding-bottom:10px;border-bottom:2px solid var(--text)}
.kw{display:inline-block;background:#33a9e6;color:#fff;border-radius:999px;padding:1px 9px;font-weight:700;font-size:13px;margin-right:3px}
.bx{display:inline-block;border:1px solid var(--text);padding:0 4px;font-size:12px;margin:0 2px}.rs{border-bottom:2px solid #e0389a;font-weight:700;padding:0 2px}
.ability{font-size:15px;line-height:1.85}
@media(max-width:560px){.viewer{flex-direction:column}}.note{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:1200px){.layout{grid-template-columns:280px minmax(0,1fr)}.detail{grid-column:1/-1;position:static;max-height:none}}
@media(max-width:760px){.layout{grid-template-columns:1fr;padding:10px}.side{position:static;max-height:none}}
</style></head><body>
<header><div class="brand">UA <span>牌組分析</span></div><div class="stat" id="topStatus">Rugia 自動卡片資料</div></header>
<div class="layout">
<aside class="panel side">
<h3>匯入 Rugia Creation 牌組</h3>
<textarea id="src" placeholder="貼上 Rugia Creation 牌組連結（deckEdit?...&Deck=...）或只貼 Deck 內容"></textarea>
<input id="dname" placeholder="牌組名稱（可留空）" style="margin-top:8px">
<div class="row"><button class="btn primary" id="go">分析並儲存牌組</button></div>
<div id="err" class="note miss"></div>
<h3>我的牌組</h3><div id="saved"></div>
<h3>Rugia 自動抓取</h3>
<input id="proxy" placeholder="Cloudflare Worker URL（例如 https://ua-rugia-proxy.xxx.workers.dev）" style="margin-top:8px">
<div class="row"><button class="btn" id="saveProxy">儲存 Proxy</button></div>
<p class="note">提交牌組後會自動逐張抓取 Rugia 的繁體中文卡名、稀有度與效果。GitHub Pages 建議使用 Cloudflare Worker 作為跨網域 Proxy。</p>
<p class="note" id="status"></p>
<p class="note" id="dbinfo"></p>
</aside>
<main><div id="deck"></div></main>
<aside class="panel detail" id="detail"></aside>
</div>
<script>
const BASE=[
{id:'UA53BT/CSM-1-003',rarity:'C',name:'淀治',jp:'デンジ',trait:'',bp:1000,image:'assets/cards/UA53BT-CSM-1-003.jpg',text:'主起動 休息 回合1次 此角色在本回合中，生產能源+紫 並獲得「主階段結束時，將此角色退場。」。'},
{id:'UA53BT/CSM-1-047',rarity:'R',name:'鏈鋸人',jp:'チェンソーマン',trait:'鏈鋸人',bp:4000,energy:4,image:'assets/cards/UA53BT-CSM-1-047.jpg',text:'此卡也被視為〈淀治〉。\n\n退場時 從以下選擇１項。\n．抽２張卡。\n．此角色下面擁有背面向上的卡的情況下，將此卡以激活狀態在自己前線登場。\n\n將此卡加入手牌，或在滿足能源需求的情況下進行突襲。'},
{id:'UA53BT/CSM-1-048',rarity:'SR',name:'鏈鋸人',jp:'チェンソーマン',trait:'鏈鋸人',bp:4000,energy:4,image:'assets/cards/UA53BT-CSM-1-048.jpg',text:'此卡也被視為〈淀治〉。\n\n此角色進行攻擊並戰鬥勝利時，若此角色下面擁有背面向上的卡，將此角色激活，並將其下面１張背面向上的卡放置到場外。\n\n將此卡加入手牌，或在滿足能源需求的情況下進行突襲。'},
{id:'UA53BT/CSM-1-013',rarity:'U',name:'帕瓦',jp:'パワー',trait:'鏈鋸人',bp:2500,energy:2,image:'assets/cards/UA53BT-CSM-1-013.jpg',text:'攻擊時 自己場上擁有〈淀治〉的情況下，此角色在本回合中，BP+500。\n\n抽１張卡。'},
{id:'UA53BT/CSM-1-024',rarity:'SR',name:'真紀真',jp:'マキマ',trait:'公安',bp:3500,energy:4,image:'assets/cards/UA53BT-CSM-1-024.jpg',text:'在前線的情況 自己〈真紀真〉以外的紫色角色卡，在全部地方也被視為事件卡。\n\n登場時 本回合中，下次從手牌使用沒有Image及沒有Image效果的事件卡的AP消耗-1。從以下選擇１項。\n．抽１張卡。\n．選擇自己場上最多１張其他角色，本回合中，BP+2000。\n\n將此卡加入手牌，或在滿足能源需求的情況下進行突襲。'},
{id:'UA53BT/CSM-1-010',rarity:'R',name:'天使惡魔',jp:'天使の悪魔',trait:'公安',bp:4000,energy:4,image:'assets/cards/UA53BT-CSM-1-010.jpg',text:'自己回合中 自己場上擁有〈真紀真〉的情況下，根據自己在本回合中使用過的事件卡的張數，此角色獲得以下全部效果。\n．１張或以上：BP+1000。\n．２張或以上：此角色不會被BP4000或以上的角色阻擋。\n\n抽１張卡。'},
{id:'UA53BT/CSM-1-068',rarity:'C',name:'真紀真',jp:'マキマ',trait:'公安',bp:1500,energy:1,image:'assets/cards/UA53BT-CSM-1-068.jpg',text:'退場時 可將自己手牌最多２張角色卡或１張事件卡放置到場外。如這樣做，將此卡加入手牌。\n\n抽牌 抽１張卡。'},
{id:'UA53BT/CSM-1-071',rarity:'C',name:'未來惡魔',jp:'未来の悪魔',trait:'公安',bp:1000,energy:1,image:'assets/cards/UA53BT-CSM-1-071.jpg',text:'主起動 休息 從自己牌庫上面查看１張卡，然後放置到牌庫上面或下面。\n\n抽１張卡。'},
{id:'UA53BT/CSM-1-079',rarity:'U',name:'有哦',jp:'有哦',trait:'事件',bp:null,energy:2,image:'assets/cards/UA53BT-CSM-1-079.jpg',text:'選擇自己最多２張AP卡被激活。\n\n自己沒有生命值的情況下，將自己牌庫上面１張卡放置到自己的生命值區。'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
// Rugia deck code key: "UA53BT_1047" <-> database id "UA53BT/CSM-1-047"
const keyOf=id=>{const m=id.match(/^(.+?)\/[A-Za-z0-9]+-(\d+)-(\d+)$/);return m?m[1]+'_'+m[2]+m[3]:id};
let custom=load('ua_cards',{});          // user-imported / edited card data, by key
let decks=load('ua_decks',[]);
let cur=decks.length?decks[0].id:null, sel=null;
const DB={};BASE.forEach(c=>DB[keyOf(c.id)]=c);
const info=k=>({...(DB[k]||{}),...(custom[k]||{})});
const known=k=>!!(DB[k]||custom[k]);
// e.g. UA53BT_1003 + version CSM -> https://rugiacreation.com/ua/search?Name=HK&Card=UA53BT_CSM-1-003#UA53BT_CSM-1-003
function cardCode(d,c){
  const set=c.key.split('_')[0],num=c.key.split('_')[1],n=info(c.key);
  if(n.id&&n.id.includes('/'))return n.id.replace('/','_');          // known full id from database
  const m=num.match(/^(\d)(\d{3})$/);
  if(d.ver&&m)return set+'_'+d.ver+'-'+m[1]+'-'+m[2];
  return null;
}
function cardUrl(d,c){
  const code=cardCode(d,c),name=d.rname?'Name='+encodeURIComponent(d.rname)+'&':'';
  return code?`https://rugiacreation.com/ua/search?${name}Card=${code}#${code}`:`https://rugiacreation.com/ua/search?${name}Find1=${encodeURIComponent(c.key.split('_')[0])}`;
}
let embed=load('ua_embed',true);
function parse(raw){
  raw=raw.trim();let deck=raw,name='',ver='';
  try{const u=new URL(raw);deck=u.searchParams.get('Deck')||'';name=u.searchParams.get('Name')||'';ver=u.searchParams.get('Version')||''}catch(e){}
  const out=[];
  for(const t of deck.split('|').map(s=>s.trim()).filter(Boolean)){
    const m=t.match(/^(\d+)([A-Za-z0-9]+)_(\d+)(?:_(\d+))?$/);
    if(!m)throw new Error('無法辨識的項目：'+t);
    out.push({qty:+m[1],key:m[2]+'_'+m[3],alt:m[4]||''});
  }
  if(!out.length)throw new Error('找不到 Deck 參數，請確認連結完整。');
  return{cards:out,name,ver,rname:name,url:/^https?:/.test(raw)?raw:''};
}

const DEFAULT_PROXY=localStorage.getItem('ua_proxy')||'';
$('proxy').value=DEFAULT_PROXY;
$('saveProxy').onclick=()=>{localStorage.setItem('ua_proxy',$('proxy').value.trim());$('status').textContent='Proxy URL 已儲存。';};

function rugiaCardUrl(d,c){
  const code=cardCode(d,c);
  if(!code)return null;
  const m=code.match(/^([^_]+)_([A-Za-z0-9]+-\\d+-\\d+)$/);
  if(!m)return null;
  return `https://rugiacreation.com/ua/search?Name=${encodeURIComponent(d.rname||'HK')}&Find1=${encodeURIComponent(m[2])}`;
}

async function fetchRugiaPage(url){
  const proxy=localStorage.getItem('ua_proxy')||'';
  const targets=[];
  if(proxy) targets.push(proxy.replace(/\\/$/,'')+'/?url='+encodeURIComponent(url));
  targets.push(url);

  let last='';
  for(const target of targets){
    try{
      const r=await fetch(target,{headers:{'Accept':'text/html,text/plain,*/*'}});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const text=await r.text();
      if(text.length>500) return text;
      last='回傳內容太短';
    }catch(e){last=e.message}
  }
  throw new Error(last||'無法取得 Rugia 頁面');
}

function cleanRugiaText(s){
  return s
    .replace(/\\r/g,'')
    .replace(/^Image$/gm,'')
    .replace(/Image(?=\\s)/g,'')
    .replace(/\\n{3,}/g,'\\n\\n')
    .trim();
}

function parseRugiaCard(raw,expectedCode){
  const doc=new DOMParser().parseFromString(raw,'text/html');
  let text=doc.body?.innerText||raw;
  text=text.replace(/\\u00a0/g,' ');
  const normalized=cleanRugiaText(text);

  const escaped=expectedCode.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&');
  const headerRe=new RegExp(escaped+'\\s*\\(([^)]+)\\)','i');
  const match=normalized.match(headerRe);
  if(!match) throw new Error('Rugia 頁面找不到 '+expectedCode);

  const start=match.index;
  const after=normalized.slice(start+match[0].length);
  const next=after.search(/\\n[A-Z0-9]+\\/[A-Z0-9-]+\\s*\\([^)]+\\)/i);
  const block=(next>=0?after.slice(0,next):after).trim();
  const lines=block.split(/\\n+/).map(x=>x.trim()).filter(Boolean);
  const name=lines.shift()||'';
  const effect=lines.filter(x=>!/^入手方法[:：]/.test(x)).join('\\n\\n').trim();

  return {name,rarity:match[1],text:effect};
}

async function autoFetchDeck(d){
  const cards=[...d.cards];
  let done=0, failed=0;
  $('status').textContent=`正在從 Rugia 取得 0/${cards.length} 張卡…`;
  for(const c of cards){
    try{
      const code=cardCode(d,c);
      if(!code){failed++;continue}
      const url=rugiaCardUrl(d,c);
      const raw=await fetchRugiaPage(url);
      const r=parseRugiaCard(raw,code.replace('_','/'));
      custom[c.key]={...custom[c.key],id:c.key,name:r.name,rarity:r.rarity,text:r.text,rugia:url};
      save('ua_cards',custom);
    }catch(e){
      failed++;
      console.warn('Rugia fetch failed',c.key,e);
    }
    done++;
    $('status').textContent=`正在從 Rugia 取得 ${done}/${cards.length} 張卡…`;
    render();
  }
  $('status').textContent=failed
    ? `完成：${done-failed} 張成功，${failed} 張需要手動開啟 Rugia。`
    : `完成：${done} 張卡已自動匯入繁體中文資料。`;
}

$('go').onclick=async()=>{
  $('err').textContent='';
  try{
    const p=parse($('src').value);
    const d={id:'d'+Date.now(),name:$('dname').value.trim()||p.name||'新牌組',ver:p.ver,rname:p.rname,url:p.url,cards:p.cards};
    decks.unshift(d);save('ua_decks',decks);cur=d.id;sel=null;$('src').value='';$('dname').value='';
    render();
    await autoFetchDeck(d);
    render();
  }catch(e){$('err').textContent=e.message}
};
function render(){
  $('saved').innerHTML=decks.map(d=>`<div class="saved ${d.id===cur?'on':''}" data-id="${d.id}"><div>${esc(d.name)}<br><small>${d.cards.reduce((n,c)=>n+c.qty,0)} 張 · ${d.cards.length} 種</small></div><button class="x" data-del="${d.id}" title="刪除">×</button></div>`).join('')||'<div class="note">尚未儲存任何牌組。</div>';
  document.querySelectorAll('.saved').forEach(el=>el.onclick=e=>{if(e.target.dataset.del){decks=decks.filter(d=>d.id!==e.target.dataset.del);save('ua_decks',decks);if(cur===e.target.dataset.del)cur=decks[0]?.id||null;sel=null}else{cur=el.dataset.id;sel=null}render()});
  $('dbinfo').textContent=`資料庫共 ${Object.keys({...DB,...custom}).length} 張卡有繁體中文效果資料。`;
  const d=decks.find(x=>x.id===cur);
  if(!d){$('deck').innerHTML='<div class="empty">貼上 Rugia Creation 牌組連結，即可分析並儲存牌組。</div>';detail();return}
  const total=d.cards.reduce((n,c)=>n+c.qty,0),miss=d.cards.filter(c=>!known(c.key)).length;
  $('deck').innerHTML=`<div class="head"><div><h2>${esc(d.name)}</h2><div class="stat">${d.ver?esc(d.ver)+' · ':''}共 ${total} 張 / ${d.cards.length} 種${miss?` · <span class="miss">${miss} 種尚無效果資料</span>`:''}</div></div>${d.url?`<a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">在 Rugia Creation 開啟 ↗</a>`:''}</div>`+
  d.cards.map((c,i)=>{const n=info(c.key);return `<div class="item ${sel===i?'on':''}" data-i="${i}"><div class="thumb">${n.image?`<img src="${esc(n.image)}" alt="" onerror="this.remove()">`:''}</div><div class="grow"><b>${esc(n.name||'（未收錄）')}${c.alt?' <span class="tag">異圖 '+esc(c.alt)+'</span>':''}</b><div class="sub">${esc(c.key)}${n.trait?' · '+esc(n.trait):''}</div></div>${n.rarity?`<span class="tag">${esc(n.rarity)}</span>`:''}<div class="qty">×${c.qty}</div></div>`}).join('');
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{sel=+el.dataset.i;render()});
  detail();
}
function fmt(t){
  let h=esc(t);
  h=h.replace(/(主起動|登場時|退場時|攻擊時|阻擋時|自己回合中|對手回合中|抽牌|激活時|突襲)/g,'<span class="kw">$1</span>');
  h=h.replace(/(回合1次|回合１次)/g,'<span class="bx">$1</span>').replace(/(休息)/g,'<span class="rs">$1</span>');
  return h;
}
function imgOf(d,c){const n=info(c.key);if(n.image)return n.image;const code=cardCode(d,c);return code?'assets/cards/'+code.replace('_','-')+'.jpg':''}
function parsePaste(t){
  // accepts text copied from a Rugia card page: "UA53BT/CSM-1-003 (C)" / card name / effect lines
  const L=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(L.length<2)return null;
  let i=0,rar='';const m=L[0].match(/^[A-Za-z0-9]+\/[A-Za-z0-9-]+\s*\((\w+)\)/);if(m){rar=m[1];i=1}
  return{rarity:rar,name:L[i],text:L.slice(i+1).join('\n')};
}
function detail(){
  const d=decks.find(x=>x.id===cur),c=d&&sel!=null?d.cards[sel]:null,el=$('detail');
  if(!c){el.innerHTML='<h3>卡片說明</h3><div class="note">點選牌組中的卡片，即可在這裡閱讀繁體中文效果。</div>';return}
  const n=info(c.key),url=cardUrl(d,c),code=cardCode(d,c),img=imgOf(d,c);
  const idline=(code?code.replace('_','/'):c.key)+(n.rarity?` (${esc(n.rarity)})`:'');
  el.innerHTML=`<div class="viewer"><div class="big">${img?`<img src="${esc(img)}" alt="" onerror="this.remove()">`:''}</div>
  <div class="r"><div class="cid">${idline}${c.alt?' · 異圖 '+esc(c.alt):''}</div><div class="cname">${esc(n.name||'（未收錄）')}</div>
  ${known(c.key)&&n.text?`<div class="ability">${fmt(n.text)}</div>`:`<div class="note miss">資料庫還沒有這張卡的效果文字。可貼上 Rugia 卡片頁的內容自動解析。</div>`}
  <div class="chips"><span class="tag">×${c.qty}</span>${n.bp?`<span class="tag">${n.bp} BP</span>`:''}${n.trait?`<span class="tag">${esc(n.trait)}</span>`:''}</div></div></div>
  <h3>${known(c.key)?'編輯卡片資料':'補充卡片資料'}</h3>
  <textarea id="e_paste" placeholder="快速貼上：在 Rugia 卡片頁選取右側文字（卡號、卡名、效果）並貼在這裡" style="min-height:64px"></textarea>
  <div class="row"><button class="btn" id="e_parse">解析貼上內容</button></div>
  <input id="e_name" placeholder="卡名" value="${esc(n.name||'')}" style="margin-top:8px"><input id="e_rar" placeholder="稀有度（如 SR）" value="${esc(n.rarity||'')}" style="margin-top:6px"><textarea id="e_text" placeholder="繁體中文效果文字" style="margin-top:6px">${esc(n.text||'')}</textarea>
  <div class="row"><button class="btn primary" id="e_save">儲存</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">開啟 Rugia 卡片頁 ↗</a></div>`;
  $('e_parse').onclick=()=>{const r=parsePaste($('e_paste').value);if(!r)return;custom[c.key]={...custom[c.key],id:c.key,...r};save('ua_cards',custom);render()};
  $('e_save').onclick=()=>{custom[c.key]={...custom[c.key],id:c.key,name:$('e_name').value.trim(),rarity:$('e_rar').value.trim(),text:$('e_text').value};save('ua_cards',custom);render()};
  $('e_fetch').onclick=async()=>{
    try{
      $('status').textContent='正在更新 '+c.key+'…';
      const code=cardCode(d,c),raw=await fetchRugiaPage(rugiaCardUrl(d,c)),r=parseRugiaCard(raw,code.replace('_','/'));
      custom[c.key]={...custom[c.key],id:c.key,name:r.name,rarity:r.rarity,text:r.text,rugia:rugiaCardUrl(d,c)};
      save('ua_cards',custom);render();$('status').textContent=c.key+' 已更新。';
    }catch(e){$('status').textContent='更新失敗：'+e.message}
  };
}
render();
</script></body></html>
