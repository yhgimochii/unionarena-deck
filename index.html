<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union Arena 牌組分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">UNION ARENA <span>牌組分析</span></div>
  <div class="header-note">Rugia Creation Deck Importer</div>
</header>

<main class="shell">
  <section class="hero">
    <div>
      <div class="eyebrow">DECK ANALYZER</div>
      <h1>從 Rugia Creation 匯入牌組</h1>
      <p>貼上 Rugia 的 deckEdit 連結，自動解析牌組並載入卡片資料。</p>
    </div>
  </section>

  <section class="import-card">
    <label for="deckUrl">Rugia Creation 牌組連結</label>
    <textarea id="deckUrl" placeholder="https://rugiacreation.com/ua/deckEdit?Name=HK&Version=CSM&Deck=4UA53BT_1047|4UA53BT_1048|..."></textarea>
    <div class="controls">
      <input id="deckName" placeholder="牌組名稱（可留空）">
      <button id="importBtn">匯入牌組</button>
    </div>
    <div id="message" class="message"></div>
  </section>

  <section id="deckSection" class="hidden">
    <div class="deck-header">
      <div>
        <div class="eyebrow">DECK</div>
        <h2 id="deckTitle">牌組</h2>
        <div id="deckMeta" class="muted"></div>
      </div>
      <button id="refreshBtn" class="secondary">重新取得卡片資料</button>
    </div>

    <div class="content-grid">
      <section>
        <div id="progress" class="progress hidden"></div>
        <div id="cards" class="cards"></div>
      </section>

      <aside id="detail" class="detail">
        <div class="detail-empty">選擇一張卡片查看詳細資料。</div>
      </aside>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
